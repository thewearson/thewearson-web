<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WEARS | Coming Soon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="content-wrapper">
        <div class="brand-container">
            <img src="logo_dark.png" alt="THE WEARS" class="brand-logo">
            
            <!-- Etkileşimli Switch -->
            <div class="switch" id="themeSwitch">
                <div class="slider"></div>
            </div>
        </div>
        
        <div class="coming-soon">COMING SOON</div>
        <!-- İnce ve Geniş İmza -->
        <div class="signature">BY RACKSGRID CO.</div>
    </div>

    <script>
        const themeSwitch = document.getElementById('themeSwitch');
        const body = document.body;

        // Switch'e tıklandığında temayı tetikler
        themeSwitch.addEventListener('click', () => {
            themeSwitch.classList.toggle('active');
            body.classList.toggle('light-theme');
        });
    </script>
</body>
</html>
