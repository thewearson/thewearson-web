<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WEARS | Coming Soon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="content-wrapper">
        <div class="brand-container">
            <!-- Logoya ID verdik ve varsayılan olarak dark olanı çağırdık -->
            <img src="logo_dark.png" alt="THE WEARS" class="brand-logo" id="brandLogo">
            
            <div class="switch" id="themeSwitch">
                <div class="slider"></div>
            </div>
        </div>
        
        <div class="coming-soon">COMING SOON</div>
        <div class="signature">BY RACKSGRID CO.</div>
    </div>

    <script>
        const themeSwitch = document.getElementById('themeSwitch');
        const body = document.body;
        const brandLogo = document.getElementById('brandLogo');

        themeSwitch.addEventListener('click', () => {
            // Switch ve arka plan temasını değiştir
            themeSwitch.classList.toggle('active');
            body.classList.toggle('light-theme');

            // Temaya göre doğru logoyu yükle
            if (body.classList.contains('light-theme')) {
                brandLogo.src = 'logo_light.png';
            } else {
                brandLogo.src = 'logo_dark.png';
            }
        });
    </script>
</body>
</html>
